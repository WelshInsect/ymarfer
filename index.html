<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145a43"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Ymarfer</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#183b30;font:17px system-ui}main{max-width:560px;margin:auto;padding:24px 18px 100px}h1{font-size:34px;margin:0}h2{font-size:20px}button{font:inherit;cursor:pointer;border:1px solid #c4d4cb;border-radius:14px;background:white;color:#183b30;padding:16px;width:100%;margin:5px 0;text-align:left}button.primary{background:#145a43;color:white;text-align:center}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{font-size:13px;text-align:center;border:0;margin:0;padding:12px 2px}nav button.active{background:#e1eee5}article{background:white;border:1px solid #c4d4cb;border-radius:20px;padding:28px 18px;text-align:center;margin:20px 0;overflow-wrap:anywhere}small{color:#52675d} .answer{border-top:1px solid #ddd;padding-top:20px;color:#145a43}input{max-width:100%}progress{width:100%;accent-color:#145a43}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd}select{font:inherit;padding:8px}</style><main><h1>Ymarfer</h1><small>Practise your Welsh</small><section id="view"></section></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), modes=[['vocabulary','en','Vocabulary · English → Welsh'],['vocabulary','cy','Vocabulary · Welsh → English'],['sentence_structure','en','Sentences · English → Welsh'],['sentence_structure','cy','Sentences · Welsh → English']];
let state={db:{vocabulary:[],sentence_structure:[]},progress:{}};try{state=JSON.parse(localStorage.getItem('ymarfer-v1'))||state}catch{}
function defaults(){state.progress??={};state.queues??={};state.daily??={};state.sessions??={};state.settings??={words:50,sentences:20,wordGoal:50,sentenceGoal:20};state.clock??=0;for(const p of Object.values(state.progress)){p.streak??=0;p.due??=0;p.correct??=0;p.incorrect??=0;}}defaults();
let tab='Home',mode=0,review=false,current=null,revealed=false,summary=null;
const save=()=>{try{localStorage.setItem('ymarfer-v1',JSON.stringify(state));return true}catch(e){alert('Could not save. Check available storage.');return false}};
function el(tag,text,parent=$('view')){let n=document.createElement(tag);n.textContent=text;parent.append(n);return n}function btn(text,fn,parent=$('view'),primary=false){let n=el('button',text,parent);n.onclick=fn;if(primary)n.className='primary';return n}
function key(m,c){return modes[m][0]+':'+modes[m][1]+':'+c.id}function pool(m,r){return state.db[modes[m][0]].filter(c=>!r||state.progress[key(m,c)]?.missed)}function day(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function daily(){return state.daily[day()]??={words:0,sentences:0,correct:0,total:0,completed:0,corrected:0,unique:{}}}function sid(){return mode+':'+review}function active(){return state.sessions[sid()]}function kind(){return mode<2?'words':'sentences'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(t){tab=t;current=null;summary=null;render()}
function dashboard(){let d=state.daily[day()]||{};el('h2',"Today's revision");for(let [k,label,goal] of [['words','Words',state.settings.wordGoal],['sentences','Sentences',state.settings.sentenceGoal]]){el('p',label+': '+(d[k]||0)+' / '+goal);let b=el('progress','');b.max=goal;b.value=Math.min(goal,d[k]||0)}el('p','Accuracy: '+(d.total?Math.round(100*d.correct/d.total)+'%':'—')+' · Sessions: '+(d.completed||0));el('small','Unique items today: '+Object.keys(d.unique||{}).length+' · Corrected: '+(d.corrected||0))}
function render(){let v=$('view');v.replaceChildren();$('nav').replaceChildren();for(let t of ['Home','Needs Practice','Progress','Settings']){let b=btn(t,()=>show(t),$('nav'));if(tab===t)b.className='active'}if(current){quiz();return}if(summary){el('h2','Da iawn!');el('p',summary.count+' answered · '+summary.correct+' correct · '+(summary.count?Math.round(100*summary.correct/summary.count):0)+'%');btn('Start another session',()=>start(mode,review),v,true);btn('Finish',()=>show('Home'));return}if(tab==='Home'||tab==='Needs Practice'){let r=tab!=='Home';if(!r)dashboard();el('h2',r?'Needs Practice':'Choose a mode');if(!state.db.vocabulary.length&&!state.db.sentence_structure.length)el('p','Import your private database in Settings to begin.');modes.forEach((m,i)=>{let a=state.sessions[i+':'+r];btn(m[2]+' ('+pool(i,r).length+')'+(a?' · Resume '+a.count+'/'+(a.limit||'∞'):''),()=>start(i,r))})}else if(tab==='Progress'){dashboard();el('h2','Last 7 days');let table=el('table','');let head=el('tr','',table);for(let h of ['Date','Words','Sentences'])el('th',h,head);for(let i=6;i>=0;i--){let dt=new Date();dt.setDate(dt.getDate()-i);let d=state.daily[day(dt)]||{},row=el('tr','',table);for(let x of [day(dt),d.words||0,d.sentences||0])el('td',x,row)}let dt=new Date(),streak=0;if(!state.daily[day(dt)]?.total)dt.setDate(dt.getDate()-1);while(state.daily[day(dt)]?.total){streak++;dt.setDate(dt.getDate()-1)}el('p','Revision streak: '+streak+' days');let all=Object.values(state.daily),sum=k=>all.reduce((a,d)=>a+(d[k]||0),0);el('p','Tracked lifetime: '+sum('words')+' words · '+sum('sentences')+' sentences · '+sum('completed')+' sessions');el('p','Tracked accuracy: '+(sum('total')?Math.round(100*sum('correct')/sum('total'))+'%':'—'));modes.forEach((m,i)=>{let p=pool(i,false),seen=p.filter(c=>state.progress[key(i,c)]),known=seen.filter(c=>!state.progress[key(i,c)].missed);el('p',m[2]+': '+known.length+' known · '+pool(i,true).length+' need practice · '+(p.length-seen.length)+' unseen · '+(p.length?Math.round(100*seen.length/p.length):0)+'% coverage')})}else{el('h2','Session settings');for(let [k,label,opts] of [['words','Words per session',[25,50,100,0]],['sentences','Sentences per session',[10,20,50,0]],['wordGoal','Daily word target',[25,50,100,200]],['sentenceGoal','Daily sentence target',[10,20,50,100]]]){el('p',label);let sel=el('select','');for(let n of opts){let o=el('option',n||'Unlimited',sel);o.value=n}sel.value=state.settings[k];sel.onchange=()=>{state.settings[k]=Number(sel.value);save()}}el('h2','Your private data');el('p','Import an updated JSON database. Existing progress is retained by ID.');file('Import database',false);btn('Export progress backup',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='ymarfer-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});file('Restore backup',true);el('small','Data stays on this device. Export a backup regularly.')}}
function file(label,backup){el('p',label);let f=el('input','');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let x=JSON.parse(await f.files[0].text()),d=backup?x.db:x;for(let k of ['vocabulary','sentence_structure']){if(!Array.isArray(d[k])||d[k].some(c=>!c.id||typeof c.welsh!=='string'||typeof c.english!=='string')||new Set(d[k].map(c=>String(c.id))).size!==d[k].length)throw Error('Invalid '+k)}if(backup&&(!x.progress||typeof x.progress!=='object'))throw Error('Invalid backup');if(backup&&!confirm('Replace current database and progress?'))return;state=backup?x:{...state,db:d};defaults();if(save())alert('Imported successfully');render()}catch(e){alert('Import failed: '+e.message)}}}
function start(i,r){mode=i;review=r;summary=null;state.sessions[sid()]??={count:0,correct:0,limit:state.settings[kind()],last:null,pending:null};next()}
function finish(){summary={...active()};delete state.sessions[sid()];if(summary.count)daily().completed++;current=null;save();render()}
function next(){let a=active(),p=pool(mode,review);if(!p.length||(a.limit&&a.count>=a.limit)){finish();return}let by=new Map(p.map(c=>[key(mode,c),c]));if(a.pending&&by.has(a.pending)){current=by.get(a.pending)}else{let due=p.filter(c=>{let k=key(mode,c),x=state.progress[k];return x?.missed&&x.due<=state.clock&&k!==a.last});let q=state.queues[mode]??={remaining:[],seen:[],last:null};let all=pool(mode,false).map(c=>key(mode,c));q.remaining=q.remaining.filter(k=>all.includes(k));q.seen=q.seen.filter(k=>all.includes(k));q.remaining.push(...shuffle(all.filter(k=>!q.remaining.includes(k)&&!q.seen.includes(k))));if(!q.remaining.length){q.remaining=shuffle(all);q.seen=[]}let chosen;if(review){let candidates=due.length?due:p.filter(c=>key(mode,c)!==a.last);if(!candidates.length)candidates=p;chosen=[...candidates].sort((x,y)=>(state.progress[key(mode,x)]?.due||0)-(state.progress[key(mode,y)]?.due||0))[0]}else if(due.length&&a.count%4===3){chosen=shuffle(due)[0]}else{let k=q.remaining.find(k=>k!==q.last)||q.remaining[0];chosen=by.get(k);q.remaining=q.remaining.filter(x=>x!==k);q.seen.push(k)}current=chosen;q.last=key(mode,current);a.pending=q.last}revealed=false;save();render()}
function quiz(){let v=$('view'),m=modes[mode],a=active();btn('← Back (save session)',()=>show(tab));el('h2',m[2]);el('small','Answered this session: '+a.count+' / '+(a.limit||'∞'));if(a.limit){let b=el('progress','');b.max=a.limit;b.value=a.count}let card=el('article','');el('small',m[1]==='en'?'Translate into Welsh':'Translate into English',card);el('h2',current[m[1]==='en'?'english':'welsh'],card);if(revealed){let ans=el('h2',current[m[1]==='en'?'welsh':'english'],card);ans.className='answer';let p=state.progress[key(mode,current)];if(p?.missed)el('small','Correction streak: '+p.streak+' / 3',card);btn('I knew it',()=>rate(false),v,true);btn('Needs practice',()=>rate(true))}else btn('Reveal answer',()=>{revealed=true;render()},v,true)}
function rate(missed){let a=active(),k=key(mode,current),p=state.progress[k]||{correct:0,incorrect:0,streak:0};state.clock++;let d=daily();d.unique??={};d.unique[modes[mode][0]+':'+current.id]=true;d[kind()]++;d.total++;if(missed){p.missed=true;p.streak=0;p.incorrect++;p.due=state.clock+4}else{p.correct++;d.correct++;a.correct++;if(p.missed){p.streak++;if(p.streak>=3){p.missed=false;d.corrected++}else p.due=state.clock+(p.streak===1?8:12)}else p.missed=false}state.progress[k]=p;a.last=k;a.pending=null;a.count++;save();next()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
