<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145a43"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Ymarfer</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#183b30;font:17px system-ui}main{max-width:560px;margin:auto;padding:24px 18px 100px}h1{font-size:34px;margin:0}h2{font-size:20px}button{font:inherit;cursor:pointer;border:1px solid #c4d4cb;border-radius:14px;background:white;color:#183b30;padding:16px;width:100%;margin:5px 0;text-align:left}button.primary{background:#145a43;color:white;text-align:center}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{font-size:13px;text-align:center;border:0;margin:0;padding:12px 2px}nav button.active{background:#e1eee5}article{background:white;border:1px solid #c4d4cb;border-radius:20px;padding:28px 18px;text-align:center;margin:20px 0;overflow-wrap:anywhere}small{color:#52675d} .answer{border-top:1px solid #ddd;padding-top:20px;color:#145a43}input{max-width:100%}</style><main><h1>Ymarfer</h1><small>Practise your Welsh</small><section id="view"></section></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), modes=[['vocabulary','en','Vocabulary · English → Welsh'],['vocabulary','cy','Vocabulary · Welsh → English'],['sentence_structure','en','Sentences · English → Welsh'],['sentence_structure','cy','Sentences · Welsh → English']];let state={db:{vocabulary:[],sentence_structure:[]},progress:{}};try{state=JSON.parse(localStorage.getItem('ymarfer-v1'))||state}catch{}let tab='Home',mode=0,review=false,current=null,revealed=false,last='',session=0;const save=()=>{try{localStorage.setItem('ymarfer-v1',JSON.stringify(state));return true}catch(e){alert('Could not save. Check available storage.');return false}};function el(tag,text,parent=$('view')){let n=document.createElement(tag);n.textContent=text;parent.append(n);return n}function btn(text,fn,parent=$('view'),primary=false){let n=el('button',text,parent);n.onclick=fn;if(primary)n.className='primary';return n}function key(m,c){return modes[m][0]+':'+modes[m][1]+':'+c.id}function pool(m,r){return state.db[modes[m][0]].filter(c=>!r||state.progress[key(m,c)]?.missed)}function show(t){tab=t;current=null;render()}function render(){let v=$('view');v.replaceChildren();$('nav').replaceChildren();for(let t of ['Home','Needs Practice','Progress','Settings']){let b=btn(t,()=>show(t),$('nav'));if(tab===t)b.className='active'}if(current){quiz();return}if(tab==='Home'||tab==='Needs Practice'){let r=tab!=='Home';el('h2',r?'Needs Practice':'Choose a mode');if(!state.db.vocabulary.length&&!state.db.sentence_structure.length)el('p','Import your private database in Settings to begin.');modes.forEach((m,i)=>btn(m[2]+' ('+pool(i,r).length+')',()=>start(i,r)));}else if(tab==='Progress'){el('h2','Your progress');modes.forEach((m,i)=>{let p=pool(i,false),seen=p.filter(c=>state.progress[key(i,c)]),known=seen.filter(c=>!state.progress[key(i,c)].missed);el('p',m[2]+': '+known.length+' known · '+pool(i,true).length+' need practice · '+(p.length-seen.length)+' unseen')})}else{el('h2','Your private data');el('p','Import an updated JSON database. Existing progress is retained by ID.');file('Import database',false);btn('Export progress backup',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='ymarfer-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});file('Restore backup',true);el('small','Data stays on this device. Export a backup regularly.')}}function file(label,backup){el('p',label);let f=el('input','');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let x=JSON.parse(await f.files[0].text()),d=backup?x.db:x;for(let k of ['vocabulary','sentence_structure']){if(!Array.isArray(d[k])||d[k].some(c=>!c.id||typeof c.welsh!=='string'||typeof c.english!=='string')||new Set(d[k].map(c=>String(c.id))).size!==d[k].length)throw Error('Invalid '+k)}if(backup&&(!x.progress||typeof x.progress!=='object'))throw Error('Invalid backup');if(backup&&!confirm('Replace current database and progress?'))return;state=backup?x:{db:d,progress:state.progress};if(save())alert('Imported successfully');render()}catch(e){alert('Import failed: '+e.message)}}}function start(i,r){mode=i;review=r;last='';session=0;next()}function next(){let p=pool(mode,review);if(!p.length){current=null;render();alert(review?'Da iawn! No questions need practice in this mode.':'No questions available.');return}let q=p.filter(c=>key(mode,c)!==last);if(!q.length)q=p;current=q[Math.floor(Math.random()*q.length)];revealed=false;render()}function quiz(){let v=$('view'),m=modes[mode];btn('← Back',()=>show(tab));el('h2',m[2]);el('small','Answered this session: '+session);let a=el('article','');el('small',m[1]==='en'?'Translate into Welsh':'Translate into English',a);el('h2',current[m[1]==='en'?'english':'welsh'],a);if(revealed){let ans=el('h2',current[m[1]==='en'?'welsh':'english'],a);ans.className='answer';btn('I knew it',()=>rate(false),v,true);btn('Needs practice',()=>rate(true))}else btn('Reveal answer',()=>{revealed=true;render()},v,true)}function rate(missed){let k=key(mode,current),p=state.progress[k]||{correct:0,incorrect:0};p.missed=missed;p[missed?'incorrect':'correct']++;state.progress[k]=p;save();last=k;session++;next()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
